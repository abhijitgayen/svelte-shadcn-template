    <path d="M100 0V630M200 0V630M300 0V630M400 0V630M500 0V630M600 0V630M700 0V630M800 0V630M900 0V630M1000 0V630M1100 0V630"/>
  </g>

  <!-- Card container -->
  <rect x="80" y="80" width="1040" height="470" rx="24" fill="#18181b" fill-opacity="0.8" stroke="#27272a" stroke-width="2"/>

  <!-- Svelte Logo mark -->
  <g transform="translate(140, 130) scale(1.6)">
    <path d="M28.4 2.8C25.2.9 20.9 1.4 18.2 4.1L8.5 13.8C6.9 15.4 6 17.6 6 19.9s.9 4.5 2.5 6.1l1.5 1.5-3.3 3.3C3.9 33.6 2.4 37.5 2.7 41.5c.3 4 2.3 7.6 5.6 9.8 3.2 2.2 7.3 2.6 10.9 1.2 3.6-1.4 6.3-4.4 7.4-8.1l.6-2.1 1.8 1.8c1.6 1.6 3.8 2.5 6.1 2.5s4.5-.9 6.1-2.5l9.7-9.7c3.4-3.4 4.3-8.6 2.2-12.9-2.1-4.3-6.8-6.9-11.6-6.4l-6.1.6 4.3-4.3c1.6-1.6 2.5-3.8 2.5-6.1s-.9-4.5-2.5-6.1l-5.3-4.4z" fill="#ff3e00"/>
  </g>

  <!-- Header text -->
  <text x="240" y="175" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-1">SvelteKit + shadcn-svelte</text>
  <text x="240" y="215" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="500">Production-Ready Modern Starter Template</text>

  <!-- Main heading -->
  <text x="140" y="310" fill="#f4f4f5" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.5">Build blazing fast web applications</text>
  <text x="140" y="355" fill="#f4f4f5" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.5">with modern developer experience.</text>

  <!-- Badges / Tags -->
  <g transform="translate(140, 420)">
    <!-- Badge 1: Svelte 5 -->
    <rect x="0" y="0" width="130" height="42" rx="10" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
    <text x="65" y="26" fill="#fb923c" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" text-anchor="middle">⚡ Svelte 5</text>

    <!-- Badge 2: SvelteKit 3 -->
    <rect x="145" y="0" width="150" height="42" rx="10" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
    <text x="220" y="26" fill="#f87171" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" text-anchor="middle">🚀 SvelteKit 3</text>

    <!-- Badge 3: Tailwind CSS v4 -->
    <rect x="310" y="0" width="170" height="42" rx="10" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
    <text x="395" y="26" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" text-anchor="middle">🎨 Tailwind v4</text>

